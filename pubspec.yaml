name: find_in_page
# Single-line and quoted on purpose. A folded (>-) scalar splits a word across
# the line break whenever the fold lands mid-token, and pub.dev renders the
# break verbatim in the sidebar caption.
description: "An in-app find bar for Flutter. Wrap your page and Ctrl+F highlights and scrolls to every match, in text you never wrapped and in lazy-list rows that were never built."
version: 2.0.0
repository: https://github.com/Yusufihsangorgel/find_in_page
issue_tracker: https://github.com/Yusufihsangorgel/find_in_page/issues

topics:
  - search
  - find
  - highlight
  - text
  - widgets

# pub.dev serves screenshots out of the archive and fits the first one into a
# 190x190 card thumbnail without cropping, so this entry is close to square and
# small. doc/demo.gif stays out of the archive; the README pulls it from GitHub.
screenshots:
  - description: "Four stock Flutter widgets, none of them wrapped or modified, each showing a search match highlighted by find_in_page."
    path: doc/searchable-grid.png

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
