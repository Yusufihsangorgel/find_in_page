name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# deploy-pages needs to mint an OIDC token and write the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One live deploy at a time. Do not cancel the run that is already
# uploading: a mid-flight Pages deploy is not safe to interrupt.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/configure-pages@v6
      # Project pages are served under /<repo>/, so every asset href has
      # to include that prefix. A user-site build would use /.
      - run: flutter build web --base-href /find_in_page/
        working-directory: example
      - uses: actions/upload-pages-artifact@v5
        with:
          path: example/build/web
      - id: deployment
        uses: actions/deploy-pages@v5
