name: ci

on:
  push:
    branches: [main]
  pull_request:

  # Weekly, so SDK, dependency and runner-image drift shows up on its
  # own rather than waiting for the next push.
  schedule:
    - cron: '52 7 * * 1'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --exclude-tags demo
      # Lowercasing can change a string's length on the web but not on the VM,
      # and the text offset tests only fail in a browser. The find bar tests
      # run there too. Their size checks override the target platform, which
      # picks the button hit size in a browser as well. The reveal tests run
      # there too. They place each match from text box geometry, and the web
      # engine computes that on its own.
      - run: flutter test --platform chrome test/text_fold_test.dart test/controller_contract_test.dart test/fold_table_test.dart test/find_bar_test.dart test/fixed_scroll_view_reveal_test.dart test/reveal_margin_test.dart test/tall_paragraph_reveal_test.dart

  # The oldest Flutter that pubspec.yaml accepts. 3.41.0 ships Dart 3.11.0,
  # which the sdk constraint needs. Code that leans on a newer API fails here
  # before someone on the floor finds it.
  floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.0
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --exclude-tags demo
