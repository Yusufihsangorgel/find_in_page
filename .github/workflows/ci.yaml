name: ci

on:
  push:
    branches: [main]
  pull_request:

  # Weekly, so SDK, dependency and runner-image drift shows up on its
  # own rather than waiting for the next push.
  schedule:
    - cron: '52 7 * * 1'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Bump after the canary job passes on a newer stable.
          flutter-version: '3.47.5'
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --exclude-tags demo
      - run: flutter test --platform chrome test/case_folding_regression_test.dart

  # The latest stable, advisory: it shows SDK drift before the pinned version
  # moves. Pull requests run only the pinned job.
  canary:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --exclude-tags demo
      - run: flutter test --platform chrome test/case_folding_regression_test.dart
