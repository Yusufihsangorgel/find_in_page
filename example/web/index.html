<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Live demo of find_in_page: an in-app find bar for Flutter that highlights matches in text you never wrapped, including lazy-list rows that were never built.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="find_in_page">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>find_in_page</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }

    body {
      min-width: 100%;
      min-height: 100vh;
      margin: 0;
    }

    #loading-screen {
      box-sizing: border-box;
      display: grid;
      min-height: 100vh;
      padding: 24px;
      place-items: center;
      text-align: center;
      background: #f8fafc;
    }

    #loading-screen h1 {
      margin: 0;
      color: #0369a1;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    #loading-message {
      margin: 8px 0 20px;
      color: #475569;
      font-size: 1rem;
    }

    #loading-indicator {
      box-sizing: border-box;
      width: 28px;
      height: 28px;
      margin: 0 auto;
      border: 3px solid #bae6fd;
      border-top-color: #0EA5E9;
      border-radius: 50%;
      animation: loading-spin 0.8s linear infinite;
    }

    #loading-message a {
      color: #0369a1;
    }

    @keyframes loading-spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      #loading-indicator {
        animation: none;
      }
    }
  </style>
  <noscript>
    <style>
      #loading-message, #loading-indicator {
        display: none;
      }
    </style>
  </noscript>
</head>
<body>
  <main id="loading-screen">
    <div>
      <h1>find_in_page</h1>
      <p id="loading-message" role="status">Loading the demo…</p>
      <noscript><p>This demo needs JavaScript to run.</p></noscript>
      <div id="loading-indicator" aria-hidden="true"></div>
    </div>
  </main>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
